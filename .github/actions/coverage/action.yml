name: "Coverage"
description: "Generate test coverage report and upload artifact"

inputs:
  retention-days:
    description: "Artifact retention in days"
    required: false
    default: "7"
  tarpaulin-version:
    description: "cargo-tarpaulin version to install"
    required: false
    default: "0.37.0"

runs:
  using: "composite"
  steps:
    - name: Cache tarpaulin binary
      id: cache-tarpaulin
      uses: actions/cache@v4
      with:
        path: ~/.cargo/bin/cargo-tarpaulin
        key: ${{ runner.os }}-tarpaulin-${{ inputs.tarpaulin-version }}

    - name: Install tarpaulin
      if: steps.cache-tarpaulin.outputs.cache-hit != 'true'
      run: cargo install cargo-tarpaulin --version ${{ inputs.tarpaulin-version }} --locked
      shell: bash

    - name: Install wasm32-wasip1 target
      run: rustup target add wasm32-wasip1
      shell: bash

    - name: Generate coverage report
      run: cargo tarpaulin --all-features --engine llvm --fail-under 95 --out Html --output-dir ./coverage --target x86_64-unknown-linux-gnu
      shell: bash

    - name: Upload coverage artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/**/*
        retention-days: ${{ inputs.retention-days }}
