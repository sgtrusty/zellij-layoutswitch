name: "Setup Rust"
description: "Install Rust toolchain with optional target and dependency caching"

inputs:
  target:
    description: "Optional rust target to install"
    required: false
    default: ""
  cache:
    description: "Enable Cargo dependency caching"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        target: ${{ inputs.target }}

    - name: Cache Cargo dependencies
      if: inputs.cache == 'true'
      uses: Swatinem/rust-cache@v2
