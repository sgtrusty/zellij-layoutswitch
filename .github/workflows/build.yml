name: Release

on:
  push:
    branches: [main]

env:
  PLUGIN_NAME: zellij-layoutswitch

jobs:
  check:
    if: startsWith(github.event.head_commit.message, 'build(v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from commit message
        id: version
        run: |
          msg="${{ github.event.head_commit.message }}"
          ver=$(echo "$msg" | sed -n 's/^build(v\([0-9]*\.[0-9]*\.[0-9]*\)[^)]*):.*/\1/p')
          echo "version=$ver" >> "$GITHUB_OUTPUT"

  unit-test:
    needs: [check]
    if: needs.check.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/unit-test

  coverage:
    needs: [check]
    if: needs.check.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/coverage
        with:
          retention-days: "7"

  release:
    needs: [check, unit-test, coverage]
    if: needs.check.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --target wasm32-wasip1
        shell: bash

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: v${{ needs.check.outputs.version }}
          files: target/wasm32-wasip1/release/${{ env.PLUGIN_NAME }}.wasm
          generate_release_notes: false
          body: |
            ## Release v${{ needs.check.outputs.version }}
            This release was automatically triggered by commit: ${{ github.sha }}

            ### Changes:
            - [View commit history for this release](https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}")
