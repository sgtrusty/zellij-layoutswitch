name: Release

# on:
#   push:
#     branches: [main]

env:
  PLUGIN_NAME: zellij-layoutswitch
  DOCKER_EXPORT_DIR: target/wasm32-wasip1/release

jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build via Docker
        run: |
          DOCKER_BUILDKIT=1 docker build \
            --target export \
            --output type=local,dest=${{ env.DOCKER_EXPORT_DIR }} \
            -t ${{ env.PLUGIN_NAME }}-builder .

      - name: Extract version from commit message
        id: version
        run: |
          msg="${{ github.event.head_commit.message }}"
          ver=$(echo "$msg" | sed -n 's/^v\([0-9]*\.[0-9]*\.[0-9]*\) release.*/\1/p')
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: ${{ env.DOCKER_EXPORT_DIR }}/${{ env.PLUGIN_NAME }}.wasm
          generate_release_notes: true
